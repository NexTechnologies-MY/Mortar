    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <title>Mortar</title>
    <meta
      name="description"
      content="Mortar — internal sales administration for tracking unit bookings through SPA signing."
    />
    <meta property="og:title" content="Mortar" />
    <meta
      property="og:description"
      content="Booked Is Not Sold. Signed Is. Every Booking, Tracked To The Signed SPA."
    />
    <meta property="og:url" content="https://mortar-ppdggwxxjq-as.a.run.app" />
    <meta property="og:image" content="https://mortar-ppdggwxxjq-as.a.run.app/og-banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme color (browser chrome on Android, address bar on Safari) -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
    <script>
      // Prevent FOUC: apply dark class before first paint. Light is the
      // default; the OS preference applies only to a stored 'system' choice.
      ;(function () {
        var theme = localStorage.getItem('theme')
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
