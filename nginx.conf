server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Every screen is a real path (/, /sign-in, /chase), so an unknown path falls back to the app rather than a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The shell names every hashed bundle, so it must revalidate or a deploy would strand browsers on the old one.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Vite content-hashes everything it emits under /assets/, so those are safe to pin forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The hero clip and its poster keep stable names and are replaced in place, so they must revalidate.
  location /media/ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
  }
}
